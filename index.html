<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task App</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        /* --- VARIABLES GLOBALES (Negro y Morado) --- */
        :root {
            --bg-deep: #050505;
            --bg-card: #151515;
            --bg-header: rgba(10, 10, 10, 0.85);
            --primary-accent: #9333EA; /* Morado */
            --primary-hover: #7E22CE;
            --text-primary: #FFFFFF;
            --text-secondary: #9CA3AF;
            --border-color: #262626;
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- CABECERA GLOBAL --- */
        .header {
            width: 100%;
            height: 60px;
            background-color: var(--bg-header);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* --- CONTENEDOR DE PANTALLAS --- */
        .screen {
            display: none;
            flex: 1;
            padding: 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            opacity: 1;
            transform: translateY(0);
        }

        /* En PC, centramos el contenido para que no se estire demasiado */
        .content-wrapper {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* --- ESTILOS DE FORMULARIO (LOGIN / REGISTRO) --- */
        .auth-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px 20px;
            width: 100%;
            margin: auto 0; /* Centrado vertical en móvil */
        }

        .screen-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .custom-input {
            width: 100%;
            background-color: var(--bg-deep);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color var(--transition-speed);
        }

        .custom-input:focus {
            border-color: var(--primary-accent);
        }

        .btn-primary {
            width: 100%;
            background-color: var(--primary-accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color var(--transition-speed);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .text-link {
            color: var(--primary-accent);
            cursor: pointer;
            text-decoration: none;
            font-weight: 500;
        }
        
        .text-link:hover { text-decoration: underline; }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* --- PANTALLA TAREAS --- */
        .task-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: var(--bg-card);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--primary-accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .icon-btn:hover { background-color: rgba(147, 51, 234, 0.1); }

        .task-input-container {
            display: flex;
            margin-bottom: 15px;
        }

        .task-input-container .custom-input {
            border-radius: 10px; /* Sin botón pegado */
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 30px;
        }

        .btn-action {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 12px 10px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-speed);
            text-align: center;
        }

        .btn-action:hover {
            border-color: var(--primary-accent);
            background-color: rgba(147, 51, 234, 0.05);
        }

        .btn-action.highlight {
            background-color: rgba(147, 51, 234, 0.15);
            color: var(--primary-accent);
            border-color: var(--primary-accent);
            font-weight: 600;
        }

        .task-list-header {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .task-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .task-item:hover {
            border-color: var(--text-secondary);
        }

        .task-item.selected {
            background-color: rgba(147, 51, 234, 0.1);
            border-color: var(--primary-accent);
        }

        .task-item.selected::after {
            content: 'check_circle';
            font-family: 'Material Icons Round';
            color: var(--primary-accent);
        }

        /* --- PANTALLA CONFIGURACIÓN --- */
        .settings-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .btn-danger {
            background-color: rgba(220, 38, 38, 0.1);
            color: #ef4444;
            border: 1px solid rgba(220, 38, 38, 0.3);
        }
        .btn-danger:hover { background-color: rgba(220, 38, 38, 0.2); }

        /* --- DISEÑO RESPONSIVO PARA PC (MEDIA QUERIES) --- */
        @media (min-width: 768px) {
            .screen { padding: 40px 20px; }
            
            /* En PC, las pantallas de login y registro se centran en la pantalla total */
            #screen-login, #screen-register {
                align-items: center;
                justify-content: center;
            }

            .auth-card {
                padding: 40px;
                max-width: 450px;
                margin: 0; /* Quita el margin auto de móvil */
            }

            .content-wrapper {
                max-width: 700px; /* Ancho cómodo para la lista de tareas en PC */
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">Task App</div>
    </div>

    <div id="screen-login" class="screen active">
        <div class="auth-card">
            <h1 class="screen-title">Iniciar Sesión</h1>
            <div class="input-group">
                <label class="input-label" for="log-user">Usuario</label>
                <input type="text" id="log-user" class="custom-input" placeholder="Ingresa tu usuario">
            </div>
            <div class="input-group">
                <label class="input-label" for="log-pass">Contraseña</label>
                <input type="password" id="log-pass" class="custom-input" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="login()">Entrar</button>
            <div class="auth-footer">
                ¿No tienes una cuenta? <span class="text-link" onclick="switchScreen('screen-register')">Regístrate aquí</span>
            </div>
        </div>
    </div>

    <div id="screen-register" class="screen">
        <div class="auth-card">
            <h1 class="screen-title">Registro</h1>
            <div class="input-group">
                <label class="input-label" for="reg-user">Nuevo Usuario</label>
                <input type="text" id="reg-user" class="custom-input" placeholder="Crea tu usuario">
            </div>
            <div class="input-group">
                <label class="input-label" for="reg-pass">Contraseña</label>
                <input type="password" id="reg-pass" class="custom-input" placeholder="Crea una contraseña">
            </div>
            <button class="btn-primary" onclick="register()">Registrarse</button>
            <div class="auth-footer">
                ¿Ya tienes una cuenta? <span class="text-link" onclick="switchScreen('screen-login')">Inicia sesión aquí</span>
            </div>
        </div>
    </div>

    <div id="screen-tasks" class="screen">
        <div class="content-wrapper">
            
            <div class="task-top-bar">
                <div class="user-badge">
                    <i class="material-icons-round" style="color: var(--primary-accent);">account_circle</i>
                    <span id="lbl-user" style="font-weight: 500;">Usuario</span>
                </div>
                <button class="icon-btn" onclick="switchScreen('screen-settings')">
                    <i class="material-icons-round" style="font-size: 28px;">settings</i>
                </button>
            </div>
            
            <div class="task-input-container">
                <input type="text" id="new-task" class="custom-input" placeholder="Escribe una nueva tarea aquí...">
            </div>

            <div class="btn-row">
                <button class="btn-action highlight" onclick="addTask()">Agregar</button>
                <button class="btn-action" onclick="completeTask()">Completar</button>
                <button class="btn-action" onclick="clearTasks()">Borrar todo</button>
            </div>

            <div class="task-list-header">Mis tareas</div>
            <div id="task-list" style="display: flex; flex-direction: column; gap: 5px;">
                </div>

        </div>
    </div>

    <div id="screen-settings" class="screen">
        <div class="content-wrapper" style="max-width: 400px; margin: auto;">
            <div class="settings-card">
                <i class="material-icons-round" style="font-size: 64px; color: var(--primary-accent); margin-bottom: 10px;">account_circle</i>
                <h2 style="margin-bottom: 5px;" id="lbl-user-settings">Usuario</h2>
                <p style="color: var(--text-secondary); margin-bottom: 20px;">Cuenta Activa</p>
                <p style="font-size: 12px; color: var(--text-secondary); margin-top: 30px;">© Task App</p>
            </div>

            <button class="btn-primary" style="background-color: var(--bg-card); color: white; border: 1px solid var(--border-color); margin-bottom: 10px;" onclick="switchScreen('screen-tasks')">
                Regresar a Tareas
            </button>
            <button class="btn-primary btn-danger" onclick="logout()">
                Cerrar Sesión
            </button>
        </div>
    </div>

<script>
    // --- LÓGICA DE LA APLICACIÓN ---
    let currentUser = "";
    let selectedTaskElement = null;

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => {
            s.classList.remove('active');
            s.style.opacity = '0';
        });
        
        const nextScreen = document.getElementById(screenId);
        nextScreen.classList.add('active');
        // Pequeño retraso para que la animación CSS se note
        setTimeout(() => {
            nextScreen.style.opacity = '1';
        }, 50);
    }

    function login() {
        let u = document.getElementById('log-user').value.trim();
        let p = document.getElementById('log-pass').value.trim();

        if (u === "" || p === "") {
            alert("No dejes espacios en blanco");
            return;
        }

        let savedPass = localStorage.getItem("user_" + u);
        if (savedPass === p && savedPass !== null) {
            currentUser = u;
            document.getElementById('lbl-user').innerText = u;
            document.getElementById('lbl-user-settings').innerText = u;
            loadTasks();
            switchScreen('screen-tasks');
        } else {
            alert("Usuario o contraseña incorrectos");
        }
    }

    function register() {
        let u = document.getElementById('reg-user').value.trim();
        let p = document.getElementById('reg-pass').value.trim();

        if (u === "" || p === "") {
            alert("No dejes espacios en blanco");
            return;
        }

        if (localStorage.getItem("user_" + u) !== null) {
            alert("Este usuario ya existe");
        } else {
            localStorage.setItem("user_" + u, p);
            alert("Registrado exitosamente");
            document.getElementById('reg-user').value = "";
            document.getElementById('reg-pass').value = "";
            switchScreen('screen-login');
        }
    }

    function getTasks() {
        let t = localStorage.getItem("tasks_" + currentUser);
        return t ? JSON.parse(t) : [];
    }

    function saveTasks(tasks) {
        localStorage.setItem("tasks_" + currentUser, JSON.stringify(tasks));
    }

    function loadTasks() {
        let tasks = getTasks();
        let listHtml = document.getElementById('task-list');
        listHtml.innerHTML = "";
        selectedTaskElement = null;

        if (tasks.length === 0) {
            listHtml.innerHTML = `<div style="text-align:center; color:var(--text-secondary); padding:30px;">No hay tareas. ¡Agrega una!</div>`;
            return;
        }

        tasks.forEach((task, index) => {
            let div = document.createElement('div');
            div.className = 'task-item';
            div.innerText = task;
            div.dataset.index = index;
            div.onclick = function() { selectTask(this); };
            listHtml.appendChild(div);
        });
    }

    function selectTask(element) {
        if (selectedTaskElement) {
            selectedTaskElement.classList.remove('selected');
        }
        if (selectedTaskElement === element) {
            selectedTaskElement = null;
        } else {
            selectedTaskElement = element;
            selectedTaskElement.classList.add('selected');
        }
    }

    function addTask() {
        let input = document.getElementById('new-task');
        let taskText = input.value.trim();
        
        if (taskText !== "") {
            let tasks = getTasks();
            tasks.push(taskText);
            saveTasks(tasks);
            input.value = "";
            loadTasks();
        }
    }

    function completeTask() {
        if (selectedTaskElement) {
            let tasks = getTasks();
            let indexToRemove = selectedTaskElement.dataset.index;
            tasks.splice(indexToRemove, 1);
            saveTasks(tasks);
            loadTasks();
        } else {
            alert("Selecciona una tarea primero de la lista dando click sobre ella.");
        }
    }

    function clearTasks() {
        if (getTasks().length > 0) {
            if(confirm("¿Estás seguro de borrar TODAS tus tareas?")) {
                saveTasks([]);
                loadTasks();
            }
        }
    }

    function logout() {
        if(confirm("¿Cerrar sesión?")) {
            currentUser = "";
            document.getElementById('log-user').value = "";
            document.getElementById('log-pass').value = "";
            switchScreen('screen-login');
        }
    }

    // Permitir usar "Enter" en los campos de texto
    document.getElementById('log-pass').addEventListener('keypress', function(e) { if(e.key === 'Enter') login(); });
    document.getElementById('reg-pass').addEventListener('keypress', function(e) { if(e.key === 'Enter') register(); });
    document.getElementById('new-task').addEventListener('keypress', function(e) { if(e.key === 'Enter') addTask(); });

</script>
</body>
</html>
