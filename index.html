<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task App</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { 
            margin: 0; 
            background-color: #2c2f38; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }
        .app-container { 
            width: 100%; 
            max-width: 400px; 
            background-color: #4a4e5a; 
            color: white; 
            display: flex; 
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            position: relative;
        }
        .header { 
            background-color: #3f51b5; 
            padding: 15px; 
            font-size: 20px; 
            display: flex; 
            justify-content: space-between;
        }
        .screen { 
            display: none; 
            flex-direction: column; 
            padding: 20px; 
            align-items: center; 
            flex-grow: 1;
        }
        .active { display: flex; }
        
        /* Controles */
        .title-box { background: white; color: black; padding: 5px 15px; margin-top: 40px; margin-bottom: 20px; font-size: 20px; }
        .input-group { background: #cfd2d6; color: black; padding: 10px; margin-bottom: 10px; width: 100%; display: flex; }
        .input-group label { width: 90px; }
        .input-group input { border: none; background: transparent; border-bottom: 1px solid gray; outline: none; flex-grow: 1; }
        
        button { 
            background-color: #b2bced; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 16px; 
            margin: 10px;
        }
        .link { color: #b2bced; cursor: pointer; margin-top: 10px; font-size: 14px; }
        
        /* Pantalla de Tareas */
        .top-bar { display: flex; justify-content: space-between; width: 100%; align-items: center; margin-bottom: 20px; }
        .user-badge { display: flex; align-items: center; background: #b2bced; color: white; padding: 5px 15px; border-radius: 20px; color: black; font-weight: bold;}
        .icon-btn { background: #b2bced; padding: 10px; border-radius: 10px; cursor: pointer; }
        .task-input { width: 100%; display: flex; background: white; margin-bottom: 20px; border-radius: 5px; overflow: hidden;}
        .task-input input { flex-grow: 1; padding: 10px; border: none; outline: none; }
        .btn-row { display: flex; width: 100%; justify-content: space-between; }
        .btn-row button { padding: 10px; margin: 0; font-size: 14px; flex-grow: 1; margin: 0 5px; }
        
        .task-list-container { width: 100%; margin-top: 20px; background: #7a7e8a; }
        .task-header { padding: 10px; border-bottom: 1px solid white; color: #d0d0d0; }
        .task-item { padding: 10px; border-bottom: 1px solid white; cursor: pointer; }
        .task-item.selected { background-color: #b2bced; color: black; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <span>Task App</span>
        <span>⋮</span>
    </div>

    <div id="screen-login" class="screen active">
        <div class="title-box">Iniciar Sesión</div>
        <div style="width: 100%; max-width: 300px;">
            <div class="input-group">
                <label>Usuario:</label>
                <input type="text" id="log-user">
            </div>
            <div class="input-group">
                <label>Contraseña:</label>
                <input type="password" id="log-pass">
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:20px;">
            <span style="font-size:14px;">¿No tienes una cuenta? Da click</span>
            <span class="link" onclick="switchScreen('screen-register')">aqui</span>
        </div>
        <button onclick="login()">Entrar</button>
    </div>

    <div id="screen-register" class="screen">
        <div class="title-box">Registro</div>
        <div style="width: 100%; max-width: 300px;">
            <div class="input-group">
                <label>Usuario:</label>
                <input type="text" id="reg-user">
            </div>
            <div class="input-group">
                <label>Contraseña:</label>
                <input type="password" id="reg-pass">
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:10px; margin-top:20px;">
            <span style="font-size:14px;">¿Ya tienes una cuenta? Da click</span>
            <span class="link" onclick="switchScreen('screen-login')">aqui</span>
        </div>
        <button onclick="register()">Registrarse</button>
    </div>

    <div id="screen-tasks" class="screen">
        <div class="top-bar">
            <div class="user-badge">👤 <span id="lbl-user"></span></div>
            <div class="icon-btn" onclick="switchScreen('screen-settings')">⚙️</div>
        </div>
        
        <label style="margin-bottom: 5px; font-size: 18px;">Escribe tu tarea:</label>
        <div class="task-input">
            <input type="text" id="new-task">
            <div style="background:gray; padding:10px; cursor:pointer;">🎤</div>
        </div>

        <div class="btn-row">
            <button onclick="addTask()">Agregar</button>
            <button onclick="completeTask()">Completar</button>
            <button onclick="clearTasks()">Borrar todo</button>
        </div>

        <div class="task-list-container">
            <div class="task-header">Mis tareas:</div>
            <div id="task-list"></div>
        </div>
    </div>

    <div id="screen-settings" class="screen">
        <div class="title-box">Configuración</div>
        <h3 style="font-weight: normal;">Cuenta: 👤 <span id="lbl-user-settings" style="color:#b2bced;"></span></h3>
        
        <button onclick="switchScreen('screen-tasks')">Regresar</button>
        <button onclick="logout()">Cerrar Sesión</button>

        <div style="margin-top: auto; text-align: center;">
            <div style="background:white; color:#3f51b5; padding:15px; border-radius:15px; display:inline-block; font-size:30px;">✔️</div>
            <p>©Task App</p>
        </div>
    </div>

</div>

<script>
    let currentUser = "";
    let selectedIndex = -1;

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // Lógica de Login
    function login() {
        let u = document.getElementById('log-user').value.trim();
        let p = document.getElementById('log-pass').value.trim();

        if (u === "" || p === "") {
            alert("No dejes espacios en blanco");
            return;
        }

        let savedPass = localStorage.getItem("user_" + u);
        if (savedPass === p) {
            currentUser = u;
            document.getElementById('lbl-user').innerText = u;
            document.getElementById('lbl-user-settings').innerText = u;
            loadTasks();
            switchScreen('screen-tasks');
        } else {
            alert("Usuario o contraseña incorrectos");
        }
    }

    // Lógica de Registro
    function register() {
        let u = document.getElementById('reg-user').value.trim();
        let p = document.getElementById('reg-pass').value.trim();

        if (u === "" || p === "") {
            alert("No dejes espacios en blanco");
            return;
        }

        if (localStorage.getItem("user_" + u) !== null) {
            alert("Este usuario ya existe");
        } else {
            localStorage.setItem("user_" + u, p);
            alert("Registrado exitosamente");
            switchScreen('screen-login');
        }
    }

    // Lógica de Tareas
    function getTasks() {
        let t = localStorage.getItem("tasks_" + currentUser);
        return t ? JSON.parse(t) : [];
    }

    function saveTasks(tasks) {
        localStorage.setItem("tasks_" + currentUser, JSON.stringify(tasks));
    }

    function loadTasks() {
        let tasks = getTasks();
        let listHtml = document.getElementById('task-list');
        listHtml.innerHTML = "";
        selectedIndex = -1;

        tasks.forEach((task, index) => {
            let div = document.createElement('div');
            div.className = 'task-item';
            div.innerText = task;
            div.onclick = function() {
                document.querySelectorAll('.task-item').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                selectedIndex = index;
            };
            listHtml.appendChild(div);
        });
    }

    function addTask() {
        let input = document.getElementById('new-task');
        if (input.value.trim() !== "") {
            let tasks = getTasks();
            tasks.push(input.value.trim());
            saveTasks(tasks);
            input.value = "";
            loadTasks();
        }
    }

    function completeTask() {
        if (selectedIndex !== -1) {
            let tasks = getTasks();
            tasks.splice(selectedIndex, 1);
            saveTasks(tasks);
            loadTasks();
        }
    }

    function clearTasks() {
        saveTasks([]);
        loadTasks();
    }

    function logout() {
        currentUser = "";
        document.getElementById('log-user').value = "";
        document.getElementById('log-pass').value = "";
        switchScreen('screen-login');
    }
</script>

</body>
</html>
